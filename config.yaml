# BunkrDownloader 설정 파일
# 이 파일에서 모든 다운로드 옵션과 URL을 관리할 수 있습니다

# 다운로드할 URL 목록 (필수)
# 아래처럼 목록(-) 형태로 여러 개의 URL을 지정할 수 있습니다.
urls:
    - https://bunkr.cr/a/JYpDeDXS

# 다운로드 경로 및 옵션 설정
download:
    custom_path: D:\실사\temp # 기본값은 Downloads 폴더 사용
    no_download_folder: false # true로 설정하면 하위 앨범 폴더를 만들지 않고 경로에 바로 다운로드

# 필터 설정
filters:
    # 이 문자열들을 포함한 파일은 건너뜁니다
    ignore:
        - .txt
        - .html
        - .ini
        - aduhaymantap
        - Afr-vA5AESH

    # 이 문자열들을 포함한 파일만 다운로드합니다 (비워두면 모든 파일 다운로드)
    include: []

# UI 및 시스템 설정
system:
    disable_ui: false # true로 설정하면 UI 없이 실행
    disable_disk_check: false # true로 설정하면 디스크 공간 체크 안 함
    max_retries: 3 # 다운로드 실패 시 재시도 횟수 (필수 추가)
